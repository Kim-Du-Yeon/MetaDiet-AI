# Separate validation Blueprint; never sync into the production Blueprint.
# DB is created separately as free PostgreSQL, then identified and seeded locally.
services:
  - type: web
    name: metadiet-api-validation
    branch: main
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python scripts/render_validation_app.py
    healthCheckPath: /health
    envVars:
      - {key: ENVIRONMENT, value: validation}
      - {key: ENABLE_SCHEDULER, value: "false"}
      - {key: LANGSMITH_TRACING, value: "false"}
      - {key: LANGCHAIN_TRACING_V2, value: "false"}
      - {key: VALIDATION_DB_ID, sync: false}
      - {key: VALIDATION_DB_NAME, value: metadiet_validation}
      - {key: VALIDATION_DB_URL, sync: false}
      - {key: VALIDATION_RUN_ID, sync: false}
      - {key: VALIDATION_API_URL, sync: false}
      - {key: VALIDATION_PUBLIC_JWK, sync: false}
      - {key: SUPABASE_JWT_SECRET, sync: false}
      - {key: ADMIN_EMAILS, sync: false}
