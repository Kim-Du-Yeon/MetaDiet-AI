apiVersion: v1
kind: ConfigMap
metadata:
  name: metadiet-config
data:
  ENABLE_SCHEDULER: "false"
  PORT: "8080"
  EMBEDDING_MODEL: "gemini-embedding-2"
  EMBEDDING_DIMENSION: "3072"
  PINECONE_INDEX_NAME: "diet-agent-rag"
  PINECONE_NAMESPACE: "metadiet-gemini-1157903c493dbb5d759f"
  RAG_CHUNKS_PATH: "/app/app/rag/builds/1157903c493dbb5d759f/chunks.pkl"
  RAG_USE_RERANK: "false"
  SERVICE_TIMEZONE: "Asia/Seoul"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadiet-api
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app: metadiet-api}
  template:
    metadata:
      labels: {app: metadiet-api}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: metadiet:local
          imagePullPolicy: IfNotPresent
          command: ["python", "main.py"]
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - secretRef: {name: metadiet-secrets}
            - configMapRef: {name: metadiet-config}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: metadiet-api
spec:
  selector: {app: metadiet-api}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30080}
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadiet-worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: metadiet-worker}
  template:
    metadata:
      labels: {app: metadiet-worker}
    spec:
      containers:
        - name: worker
          image: metadiet:local
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          envFrom:
            - secretRef: {name: metadiet-secrets}
            - configMapRef: {name: metadiet-config}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metadiet-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: metadiet-api}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metadiet-mcp-config
data:
  SUPABASE_URL: ""
  SUPABASE_SERVICE_KEY: ""
  SUPABASE_JWT_SECRET: ""
  GEMINI_MODEL: "gemini-3.8-flash"
  EMBEDDING_MODEL: "gemini-embedding-2"
  EMBEDDING_DIMENSION: "3072"
  PINECONE_INDEX_NAME: "diet-agent-rag"
  PINECONE_NAMESPACE: "metadiet-gemini-1157903c493dbb5d759f"
  RAG_CHUNKS_PATH: "/app/app/rag/builds/1157903c493dbb5d759f/chunks.pkl"
  RAG_USE_RERANK: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadiet-mcp
spec:
  replicas: 1
  selector:
    matchLabels: {app: metadiet-mcp}
  template:
    metadata:
      labels: {app: metadiet-mcp}
    spec:
      containers:
        - name: mcp
          image: metadiet:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.mcp.server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8090"]
          ports:
            - {name: mcp, containerPort: 8090}
          envFrom:
            - secretRef: {name: metadiet-mcp-secrets}
            - configMapRef: {name: metadiet-mcp-config}
          readinessProbe:
            tcpSocket: {port: mcp}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: mcp}
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: metadiet-mcp
spec:
  selector: {app: metadiet-mcp}
  ports:
    - {name: mcp, port: 8090, targetPort: mcp}
  type: ClusterIP
